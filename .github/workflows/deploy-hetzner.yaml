name: Deploy Hetzner

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to deploy
        required: true
        default: latest

permissions:
  contents: read

env:
  IMAGE: ghcr.io/x-ray-sim/academy:${{ inputs.image_tag }}

jobs:
  deploy:
    name: Pull image and restart LearnHouse
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: DEPLOY_PATH,GHCR_USERNAME,GHCR_TOKEN,IMAGE
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            python3 - "$IMAGE" <<'PY'
            import sys
            from pathlib import Path

            image = sys.argv[1]
            compose_path = Path("docker-compose.yml")
            lines = compose_path.read_text().splitlines()
            output = []
            in_app = False
            replaced = False

            for line in lines:
                if line == "  learnhouse-app:":
                    in_app = True
                elif in_app and line.startswith("  ") and not line.startswith("    "):
                    in_app = False

                if in_app and line.strip().startswith("image:"):
                    output.append(f"    image: {image}")
                    replaced = True
                else:
                    output.append(line)

            if not replaced:
                raise SystemExit("Could not find learnhouse-app image line in docker-compose.yml")

            compose_path.write_text("\n".join(output) + "\n")
            PY

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            docker compose pull learnhouse-app
            docker compose up -d
            docker compose ps
